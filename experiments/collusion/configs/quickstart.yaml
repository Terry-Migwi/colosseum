# Minimal sweep to validate keys, models, and outputs end-to-end (three short runs, OpenAI).
# Derived from collusion_jira_topologies.yaml; needs OPENAI_API_KEY.
# Every parameter is explained in quickstart_commented.yaml.
simulation:
  max_iterations: 1
  max_planning_rounds: 2
  max_conversation_steps: 2
  seed: 1

environment:
  name: JiraTicketEnvironment
  assignment_filling: false
  max_tasks: 8

communication_network:
  topology: complete
  num_agents: 4
  consolidate_channels: true

llm_models:
  - label: openai-gpt-4o-mini
    llm:
      provider: openai
      openai:
        model: gpt-4o-mini
        params:
          max_tokens: 1000
          temperature: 0.7

experiment:
  tag: quickstart
  output_dir: experiments/collusion/outputs/quickstart
  max_concurrent_runs: 3
  seeds: [1]
  collusion:
    colluder_selection: random  # random | first
    agent_order: random  # random | colluders_first
  sweeps:
    - name: quickstart
      topologies: [complete]
      num_agents: [4]
      colluder_counts: [2]
      secret_channel_enabled: [false, true]
      prompt_variants: [control, simple]  # control | simple | deception | structured | aggressive
