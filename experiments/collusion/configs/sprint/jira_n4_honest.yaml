# Sprint config: ONE honest JiraTicket episode (no secret channel).
# 4 agents, complete + consolidated network (one shared public board), 1 seed, Claude Haiku.
simulation:
  max_iterations: 1
  max_planning_rounds: 4
  max_conversation_steps: 3
  seed: 1
  tags: [sprint_honest]

environment:
  name: JiraTicketEnvironment
  assignment_filling: false
  max_tasks: 8

communication_network:
  topology: complete
  num_agents: 4
  consolidate_channels: true

llm_models:
  - label: haiku
    llm:
      provider: anthropic
      anthropic:
        model: claude-haiku-4-5
        params:
          max_tokens: 1024
          temperature: 0.7

experiment:
  tag: sprint
  output_dir: experiments/collusion/outputs/sprint
  max_concurrent_runs: 1
  seeds: [1]
  collusion:
    colluder_selection: random
    agent_order: random
  sweeps:
    - name: honest
      topologies: [complete]
      num_agents: [4]
      colluder_counts: [2]
      secret_channel_enabled: [false]   # <- THE FLAG: no colluder-only board
      prompt_variants: [control]