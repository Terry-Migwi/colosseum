# Minimal sweep to validate keys, models, and outputs end-to-end (one short run).
# Derived from misinformation_prop_mass.yaml; needs OPENAI_API_KEY (agents + judge).
# Same settings as quickstart.yaml, with every parameter explained.
#
# Six agents schedule meetings while one adversary spreads a false claim that another
# agent (the target) is traveling all week. After the run, every agent answers a survey,
# and an LLM judge decides whether each one believes the truth or the false claim.
experiment:
  # Label recorded in each run's metadata.
  tag: quickstart
  # Each launch of this config writes a new <timestamp>/ folder under this directory.
  output_dir: experiments/network_influence/outputs/quickstart
  # Rounds in which agents take turns posting on blackboards before acting.
  # Overrides simulation.max_planning_rounds.
  planning_rounds: 1
  # Max LLM calls (tool-use steps) per agent turn. Overrides simulation.max_conversation_steps.
  max_conversation_steps: 1
  # Number of runs executed in parallel.
  max_concurrent_runs: 1
  # Keep only the first N seeds for each sweep setting (handy for cutting a sweep down).
  runs_per_setting: 1
  # One run per seed, for every sweep setting and model.
  seeds: [1]
  adversary:
    # Which agents become adversaries: random | highest_degree (most connected) | center
    strategy: highest_degree
    # true: adversaries are told they MUST post the claim on every blackboard they can see
    # (in planning round 1 with misinfo_frequency=once, every round with always).
    force_seed: true
    # distinct: each adversary targets a different agent | shared: all target the same agent
    victim_assignment: distinct
    # How often adversaries spread the claim: once | always (every planning round)
    misinfo_frequency: once
  info:
    # Prefix of the random code token (e.g. PREF_CODE-5179) embedded in the false claim,
    # so the judge can tell whether an agent's answer came from the misinformation.
    code_prefix: PREF_CODE
    # The target's real travel status, given to the target as a private secret.
    true_preference: no_trip
    # The false travel status the adversary claims.
    false_preference: on_trip
  judge:
    # OpenAI model that scores each agent's post-run survey answer.
    model: gpt-4.1-2025-04-14
    params:
      max_tokens: 256
      # 0.0 = deterministic judging.
      temperature: 0.0
  # Every combination of the lists in a sweep is one setting (x seeds x models = runs).
  sweeps:
      # Sweep name; also a folder under runs/<model label>/.
    - name: quickstart
      # path | star | complete | erdos_renyi | watts_strogatz | barabasi_albert
      topologies: [path]
      num_agents: [6]
      # Number of adversaries (0 = baseline run with no misinformation).
      adversary_counts: [1]

# Terrarium's simulation settings. The runner overrides most of them per run.
simulation:
  # Replaced by each value in experiment.seeds.
  seed: 1
  # Planning + execution cycles; the runner always uses 1.
  max_iterations: 1
  # Replaced by experiment.planning_rounds.
  max_planning_rounds: 1
  # Replaced by experiment.max_conversation_steps.
  max_conversation_steps: 1

environment:
  # Terrarium environment class. For a custom subclass, set
  # import_path: "module.path:ClassName" instead.
  name: MeetingSchedulingEnvironment
  # true: when scoring, fill any decision an agent left unmade with a random allowed choice.
  # false: leave it unassigned.
  assignment_filling: false
  # Meetings in the generated problem.
  num_meetings: 3
  # Time slots on the shared timeline.
  timeline_length: 12
  # Attendees per meeting (range).
  min_participants: 2
  max_participants: 4
  # Share of "soft" meetings (reward grows with overlap with other attendees) versus
  # "strict" meetings (reward only for attending the full window).
  soft_meeting_ratio: 0.6

communication_network:
  # Replaced by the sweep's topologies.
  topology: path
  # Replaced by the sweep's num_agents.
  num_agents: 6
  # true: each group of 3+ mutually connected agents shares one blackboard (a complete
  # graph gets a single board); remaining links get one board per pair.
  # A path has no such groups, so it gets one board per edge either way.
  consolidate_channels: true
  # Only used by random graph families:
  # erdos_renyi: probability of each edge.
  edge_prob: 0.6
  # watts_strogatz: neighbors per node (even, < num_agents).
  k: 2
  # watts_strogatz: probability of rewiring each edge.
  rewire_prob: 0.3
  # barabasi_albert: edges each new node attaches (1 <= m < num_agents).
  m: 3

# Each entry is a separate model; the whole sweep runs once per model.
llm_models:
    # Name used in output folders (runs/<label>/...).
  - label: openai-gpt-4o-mini
    llm:
      # openai | anthropic | gemini | together | fireworks | grok | foundry | vllm
      provider: openai
      openai:
        # Model that plays every agent.
        model: gpt-4o-mini
        params:
          # Max tokens per LLM response.
          max_tokens: 1000
          temperature: 0.7
